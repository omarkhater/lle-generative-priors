# Base configuration for Stage1 experiments

# Experiment metadata
experiment_name: "stage1_base"
run_name: "base_config"
description: "Base Stage1 configuration with default parameters"

# Dataset configuration
dataset_name: "SICE_paired"
dataset_id: "okhater/SICE"
batch_size: 16
val_split_ratio: 0.2

# Model configuration
latent_space_dim: 64
num_cross_attn_heads: 8
num_self_attn_heads: 8

# Training configuration
learning_rate: 1e-4
weight_decay: 1e-4
num_epochs: 5
patience: 1
val_frequency: 1
use_scheduler: true
scheduler_gamma: 0.8

# Loss weights
weight_cont: 0.1  # Content loss weight
weight_rec: 1.0   # Reconstruction loss weight
weight_ref: 0.1   # Reflectance loss weight
weight_ill: 0.01  # Illumination loss weight
lambda_g: 10.0    # Gradient regularization weight

save_model: true
model_save_dir: "trained_models/stage1"