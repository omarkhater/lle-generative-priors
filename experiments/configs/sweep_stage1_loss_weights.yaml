base:
  experiment_name: "stage1_gradnorm_adaptive‐ctdn_sweep"
  run_name: "GradNorm‑based adaptive loss weighting - Stronger Content (Encoder+Decoder) Weight"
  description: "Train Stage‑1 of LightenDiffusion with GradNorm‑learned global loss weights (content vs CTDN) while Bayesian‑sweeping the internal CTDN terms — weight_rec, weight_ref, weight_ill, and lambda_g — to discover the best decomposition balance without manual tuning."
  num_epochs: 50
  device: cuda
  dataset_name: "SICE_paired"
  dataset_id: "okhater/SICE"
  batch_size: 16
  val_split_ratio: 0.2
  learning_rate: 1e-5
  weight_decay: 1e-4
  patience: 5
  val_frequency: 3
  use_scheduler: true
  scheduler_gamma: 0.8
  pretrain_content_ratio: .15
  pretrain_ctdn_ratio: .05
  local_save_directory: "/home/grads/o/omarkhater/projects/lle-generative-priors/experiments/artifacts"
  objective_metric: "psnr"
  n_trials: 1

  s3_upload:
    prefix: "experiments/artifacts"
    bucket: "lle-generative-priors"

sweep:
  weight_rec: {start: 0.05, end: 3, scale: "log"} # CTDN reconstruction term
  weight_ref: {start: 0.0001, end: 1, scale: "log"} # CTDN reflectance‑consistency term
  weight_ill: {start: 0.0001, end: 1, scale: "log"} # CTDN illumination‑smoothness term
  lambda_g: {start: 0.05, end: 10, scale: "log"} # Edge‑aware smoothing coefficient in L_ill

encoder:
  base_channels: 64
  channel_factors: [1, 2, 4]
  in_channels: 3
  encoded_channels: 64

decoder:
  base_channels: 64
  channel_factors: [1, 2, 4]
  out_channels: 3
  encoded_channels: 64

decomposer:
  channels: 64
  num_cross_attention_heads: 8
  num_self_attention_heads: 8